name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # Older SDKs deliberately exercise the AI-compiled-OUT path
        # (#if canImport(FoundationModels) == false). macOS 26 runners, when
        # available, exercise the AI-compiled-IN path.
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcrun swiftc --version

      - name: Build
        run: |
          mkdir -p build
          xcrun swiftc -O -parse-as-library src/*.swift -o build/desktidy-sort
          codesign -s - -i com.desktidy.sort build/desktidy-sort

      - name: Self-test (deterministic safety checks)
        run: ./build/desktidy-sort --self-test

      - name: Health
        run: ./build/desktidy-sort --health

      - name: Read-only access probe is read-only
        run: |
          SB="$(mktemp -d)/desk"; APP="$(mktemp -d)/app"; mkdir -p "$SB" "$APP"
          touch "$SB/a-file.png"
          before="$(ls -1A "$SB")"
          DESKTIDY_TARGET_DIR="$SB" DESKTIDY_APP_DIR="$APP" ./build/desktidy-sort --check-access
          after="$(ls -1A "$SB")"
          test "$before" = "$after"

      - name: End-to-end sandbox sort
        run: |
          SB="$(mktemp -d)/desk"; APP="$(mktemp -d)/app"; mkdir -p "$SB" "$APP"
          OLD="$(date -v-1H +%Y%m%d%H%M)"
          for f in photo.png clip.mp4 song.mp3 report.pdf main.rs backup.zip mystery.xyz; do
            touch "$SB/$f"; touch -t "$OLD" "$SB/$f"
          done
          mkdir "$SB/dropped-folder"; touch -t "$OLD" "$SB/dropped-folder"
          DESKTIDY_TARGET_DIR="$SB" DESKTIDY_APP_DIR="$APP" ./build/desktidy-sort --verbose
          test -f "$SB/Images/photo.png"
          test -f "$SB/Videos/clip.mp4"
          test -f "$SB/Audio/song.mp3"
          test -f "$SB/Documents/report.pdf"
          test -f "$SB/Code/main.rs"
          test -f "$SB/Archives/backup.zip"
          test -f "$SB/Inbox/mystery.xyz"
          test -d "$SB/Folders/dropped-folder"
          echo "all routing assertions passed"

      - name: R0 hostile controls (authority, receipts, confinement, recovery)
        run: ./build/desktidy-sort --r0-test

      - name: R0 entry-point convergence (every setup path calls the guard)
        run: |
          grep -q -- '--authority-check' src/desktidy-cli.sh
          grep -q -- '--authority-check' install.sh
          grep -q 'AuthorityGuard().evaluate' src/DeskTidy.swift
          echo "all setup/start paths invoke the authority guard"

      - name: R1A effective-state gates (matrix, parity, fail-closed UI, read-only)
        run: ./build/desktidy-sort --state-test

      - name: R1A app build + hermetic fixture smokes
        run: |
          chmod +x scripts/smoke-app.sh scripts/test-smoke-isolation.sh scripts/test-cli-status.sh
          ./scripts/test-smoke-isolation.sh
          ./scripts/build-app.sh build
          AG=$(mktemp -d); TG=$(mktemp -d); AP=$(mktemp -d)
          PROG=$(mktemp -d)/mover; printf '#!/bin/sh\n' > "$PROG"
          /usr/bin/python3 - "$AG" "$TG" "$PROG" <<'PYEOF2'
          import plistlib, sys, os, json
          ag, tg, prog = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(os.path.join(ag, 'com.example.fixture-mover.plist'), 'wb') as f:
              plistlib.dump({'Label': 'com.example.fixture-mover', 'ProgramArguments': [prog], 'WatchPaths': [tg]}, f)
          with open(os.path.join(ag, 'state.json'), 'w') as f:
              json.dump({'com.example.fixture-mover': 'running'}, f)
          PYEOF2
          DESKTIDY_AGENTS_DIR="$AG" DESKTIDY_TARGET_DIR="$TG" DESKTIDY_APP_DIR="$AP" \
            DESKTIDY_LAUNCHD_STATE_FILE="$AG/state.json" EXPECTED_OVERALL=foreignConflict \
            ./scripts/smoke-app.sh ./build/DeskTidy.app/Contents/MacOS/DeskTidy
          AG2=$(mktemp -d); TG2=$(mktemp -d); AP2=$(mktemp -d)
          printf '%s\n' '{}' > "$AG2/state.json"
          DESKTIDY_AGENTS_DIR="$AG2" DESKTIDY_TARGET_DIR="$TG2" DESKTIDY_APP_DIR="$AP2" \
            DESKTIDY_LAUNCHD_STATE_FILE="$AG2/state.json" EXPECTED_OVERALL=pausedNotLoaded \
            ./scripts/smoke-app.sh ./build/DeskTidy.app/Contents/MacOS/DeskTidy

      - name: App icon bundle contract
        run: scripts/test-app-icon.sh build/DeskTidy.app

      - name: Homebrew source-built preview remains non-mutating
        run: scripts/test-homebrew-source-preview.sh

      - name: Migration bundle and transactional fake-substrate gates
        run: |
          scripts/test-migration-bundle.sh build/DeskTidy.app "$(git rev-parse HEAD)"
          scripts/test-live-migration.sh

      - name: Native status surface launches and captures
        run: |
          chmod +x scripts/test-native-status-surface.sh
          ./scripts/test-native-status-surface.sh \
            "$(pwd)/build/DeskTidy.app" \
            "/private/tmp/desktidy-ci-status-${{ matrix.os }}.png"

      - name: Public CLI status consumes shared effective-state
        run: ./scripts/test-cli-status.sh ./build/desktidy-sort

      - name: R1B Phase 1A fake-substrate harness
        run: |
          chmod +x scripts/build-probe.sh scripts/test-phase1a-wiring.sh
          ./scripts/test-phase1a-wiring.sh
          ./build/desktidy-sort --phase1a-test
          ./build/desktidy-sort --phase1a1-test
          ./build/desktidy-sort --phase1b-test
          ./build/desktidy-sort --phase2-test
          chmod +x scripts/test-phase1a1-public-boundary.sh
          ./scripts/test-phase1a1-public-boundary.sh
          ./scripts/build-probe.sh build
          test -x ./build/DeskTidySacrificialProbe.app/Contents/MacOS/DeskTidySacrificialProbe
          test -x ./build/DeskTidySacrificialProbe.app/Contents/MacOS/SacrificialHelper
          test -f ./build/DeskTidySacrificialProbe.app/Contents/Library/LaunchAgents/com.desktidy.sacrificial.plist
          codesign -dv ./build/DeskTidySacrificialProbe.app
          ./build/DeskTidySacrificialProbe.app/Contents/MacOS/DeskTidySacrificialProbe --plan | grep -q 'read-only\|NON-PRODUCTION\|UNOBSERVED'

      - name: App actions use canonical core and contain no raw mutation bypass
        run: |
          for f in app/DeskTidyApp.swift src/EffectiveState.swift; do
            if sed 's://.*$::' "$f" | grep -nE 'moveItem|removeItem|copyItem|createFile|bootstrap|bootout|writePending|ledger\.append'; then
              echo "mutation symbol found in $f"; exit 1
            fi
          done
          grep -q 'core\.tidyNow()' app/DeskTidyApp.swift
          grep -q 'core\.undo(receiptID:' app/DeskTidyApp.swift
          echo "app actions use canonical core; no raw mutation bypass found"

      - name: Collision safety (never overwrite)
        run: |
          SB="$(mktemp -d)/desk"; APP="$(mktemp -d)/app"; mkdir -p "$SB" "$APP"
          OLD="$(date -v-1H +%Y%m%d%H%M)"
          echo one > "$SB/dup.txt"; touch -t "$OLD" "$SB/dup.txt"
          DESKTIDY_TARGET_DIR="$SB" DESKTIDY_APP_DIR="$APP" ./build/desktidy-sort
          echo two > "$SB/dup.txt"; touch -t "$OLD" "$SB/dup.txt"
          DESKTIDY_TARGET_DIR="$SB" DESKTIDY_APP_DIR="$APP" ./build/desktidy-sort
          count=$(find "$SB/Documents" -name 'dup*' | wc -l | tr -d ' ')
          test "$count" -eq 2
          echo "both copies preserved ($count)"
